[package]
name = "viewr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Minimalist native image viewer for macOS (JPEG, PNG, Nikon NEF previews)"
rust-version = "1.88"

[[bin]]
name = "viewr"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Finder open-events (application:openURLs:) are added to winit's delegate class
# at runtime; objc2 is the same copy winit itself links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[lints.rust]
# deny (not forbid) so src/macos.rs — the Finder/Open-With glue — can opt in
# locally with #[allow(unsafe_code)]; unsafe stays an error everywhere else.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
